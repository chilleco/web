name: CI/CD prod
run-name: Deploy prod from ${{ github.ref_name }}

on:
  push:
    branches: [ "main", "simplify-frontend" ]
  workflow_dispatch:

# Both release branches update the same VPS stack; finish one release at a time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ENV: prod

jobs:
  web-check:
    name: Web Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v3

      - name: Deployment checks
        working-directory: .
        run: make test-infra ENV_FILE=/dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  # tests:
  #   name: Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v3

  #     - name: Setting up environment variables
  #       run: |
  #         cp .env.example .env
  #         echo "ENV=test" >> .env
  #         echo "DATA_PATH=./data" >> .env

  #     - name: Running tests inside the container
  #       run: make run-test

  build-and-push:
    name: Build & Push
    needs: web-check
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      release: ${{ steps.set-tags.outputs.release }}
      image_tag: ${{ steps.set-tags.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set RELEASE and IMAGE_TAG
        id: set-tags
        run: |
          RELEASE="$(git rev-parse --short HEAD)"
          IMAGE_TAG="${ENV}-${RELEASE}"
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}     # PAT or token

      - name: Build & push images
        env:
          NEXT_PUBLIC_ENV: ${{ env.ENV }}
          NEXT_PUBLIC_API: ${{ vars.PROTOCOL }}://${{ vars.EXTERNAL_HOST }}/api/
          NEXT_PUBLIC_WEB: ${{ vars.PROTOCOL }}://${{ vars.EXTERNAL_HOST }}/
          NEXT_PUBLIC_NAME: ${{ vars.NAME }}
          NEXT_PUBLIC_LOCALE: ${{ vars.LOCALE }}
          NEXT_PUBLIC_TG_BOT: ${{ vars.TG_BOT }}
        run: |
          for svc in api web tg; do
            CONTEXT="$svc"
            DOCKERFILE="$svc/Dockerfile"
            IMAGE="${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_OWNER }}/${{ vars.PROJECT_NAME }}/${svc}"
            BUILD_ARGS=()
            if [ "$svc" = "web" ]; then
              for key in NEXT_PUBLIC_ENV NEXT_PUBLIC_API NEXT_PUBLIC_WEB NEXT_PUBLIC_NAME NEXT_PUBLIC_LOCALE NEXT_PUBLIC_TG_BOT; do
                BUILD_ARGS+=(--build-arg "$key=$(printenv "$key")")
              done
            fi
            docker buildx build \
              --platform linux/amd64 \
              -f $DOCKERFILE \
              "${BUILD_ARGS[@]}" \
              -t $IMAGE:${{ env.IMAGE_TAG }} \
              -t $IMAGE:latest \
              $CONTEXT \
              --push || exit 1
          done
          #  --platform linux/amd64,linux/arm64

  deploy-main:
    name: Deploy Prod
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy to Swarm via SSH
        uses: appleboy/ssh-action@v0.1.7
        env:
          ENV_VARS_JSON: ${{ toJson(vars) }}
          ENV_SECRETS_JSON: ${{ toJson(secrets) }}
        with:
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_VARS_JSON,ENV_SECRETS_JSON
          command_timeout: 30m
          # script_stop: true
          script: |
            # set -euo pipefail

            FOLDER=${{ vars.FOLDER }}
            PROJECT_NAME=${{ vars.PROJECT_NAME }}
            ENV=${{ env.ENV }}
            STACK_NAME="${PROJECT_NAME}-${ENV}"
            GITHUB_SERVER_URL=${{ github.server_url }}
            GITHUB_REPOSITORY=${{ github.repository }}
            COMMIT_SHA=${{ github.sha }}
            RELEASE=${{ needs.build-and-push.outputs.release }}
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            GITHUB_HOST="${GITHUB_SERVER_URL#https://}"
            GITHUB_HOST="${GITHUB_HOST#http://}"
            REPOSITORY="git@${GITHUB_HOST}:${GITHUB_REPOSITORY}.git"
            REGISTRY="${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_OWNER }}"
            DATA_PATH=${{ vars.DATA_PATH }}
            export ENV STACK_NAME COMMIT_SHA RELEASE IMAGE_TAG REPOSITORY REGISTRY
            echo "Pulling new version"
            if [ -d "$FOLDER" ];
            then
                cd "$FOLDER" || exit 1
                git fetch --prune origin
                git checkout -f --detach "$COMMIT_SHA"
                git reset --hard "$COMMIT_SHA"
                git clean -fd
            else
                GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" git clone "$REPOSITORY" "$FOLDER"
                cd "$FOLDER" || exit 1
                git checkout --detach "$COMMIT_SHA"
            fi

            # Runtime settings may contain literal ~/ paths. Keep deployment paths
            # separate from that import, and write their expanded values below.
            deploy_dir="$(pwd -P)" || exit 1
            case "$DATA_PATH" in
              /*) data_dir="$DATA_PATH" ;;
              *) data_dir="$deploy_dir/$DATA_PATH" ;;
            esac
            DATA_ROOT="$(dirname "$data_dir")"

            echo "Checking data directory"
            if [ -d "$DATA_ROOT" ];
            then
                echo ""
            else
                mkdir -p "$DATA_ROOT"
            fi
            if [ -d "$data_dir" ];
            then
                echo ""
            else
                cp -r "$deploy_dir/data" "$data_dir"
            fi
            # Swarm bind mounts require the source directory to exist on the VPS.
            mkdir -p "$data_dir/redis" || exit 1

            echo "Generating .env"
            ENV_LIST="$deploy_dir/infra/compose/.env.list"
            ENV_OUT="$deploy_dir/.env"
            if ! command -v jq >/dev/null 2>&1; then
              echo "jq is required to generate .env from GitHub vars/secrets"
              exit 1
            fi
            : > "$ENV_OUT"
            while IFS= read -r raw; do
              key="$(echo "$raw" | xargs)"
              case "$key" in
                ''|\#*) continue ;;
              esac
              key_lc="$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')"
              value="$(printf '%s' "$ENV_SECRETS_JSON" | jq -r --arg key "$key" '.[$key] // empty')"
              if [ -z "$value" ] && [ "$key_lc" != "$key" ]; then
                value="$(printf '%s' "$ENV_SECRETS_JSON" | jq -r --arg key "$key_lc" '.[$key] // empty')"
              fi
              if [ -z "$value" ]; then
                value="$(printf '%s' "$ENV_VARS_JSON" | jq -r --arg key "$key" '.[$key] // empty')"
              fi
              if [ -z "$value" ] && [ "$key_lc" != "$key" ]; then
                value="$(printf '%s' "$ENV_VARS_JSON" | jq -r --arg key "$key_lc" '.[$key] // empty')"
              fi
              if [ -z "$value" ]; then
                value="$(printenv "$key")"
              fi
              if [ -z "$value" ] && [ "$key_lc" != "$key" ]; then
                value="$(printenv "$key_lc")"
              fi
              case "$key" in
                FOLDER) value="$deploy_dir" ;;
                DATA_PATH) value="$data_dir" ;;
              esac
              value="$(printf '%s' "$value" | tr '\r' '\n' | awk 'BEGIN{ORS="";} {gsub(/\n/,"\\\\n"); print}')"
              printf '%s=%s\n' "$key" "$value" >> "$ENV_OUT"
            done < "$ENV_LIST"

            # login to registry
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login \
                   ${{ vars.REGISTRY_HOST }} \
                   --username ${{ vars.REGISTRY_USER }} --password-stdin

            # compile compose file
            rm -f "$deploy_dir/deploy.yml"
            export ENV_FILE_PATH="$deploy_dir/.env"
            while IFS='=' read -r key value; do
              case "$key" in
                ''|\#*) continue ;;
              esac
              # trim whitespace from key and escape quotes in value to keep JSON-like strings intact
              key="${key//[[:space:]]/}"
              value="${value%$'\r'}"
              value="${value//\"/\\\"}"
              export "${key}=${value}"
            done < "$ENV_FILE_PATH"
            export RELEASE="$RELEASE"
            export IMAGE_TAG="$IMAGE_TAG"
            make check-deploy ENV="$ENV" ENV_FILE="$ENV_FILE_PATH" || exit 1

            # optional: pull fresh images
            for service in api web tg; do
              sudo docker pull "$REGISTRY/$PROJECT_NAME/${service}:$IMAGE_TAG" || exit 1
            done

            # deploy (with registry auth)
            sudo docker stack deploy \
                  --compose-file "$deploy_dir/deploy.yml" \
                  --with-registry-auth \
                  --prune \
                  "$STACK_NAME" || exit 1

            # force update all services to ensure new images are deployed
            # this handles cases where services are at max replicas per node
            echo "Force updating services to ensure latest images are deployed..."
            for service in api web tg worker scheduler; do
              image_suffix="$service"
              if [ "$service" = "worker" ] || [ "$service" = "scheduler" ]; then
                image_suffix="api"
              fi
              echo "Updating ${STACK_NAME}_${service} with stop-first strategy to avoid replica-limit deadlocks..."
              sudo docker service update \
                --image $REGISTRY/$PROJECT_NAME/${image_suffix}:$IMAGE_TAG \
                --update-order stop-first \
                --update-parallelism 1 \
                --force \
                "${STACK_NAME}_${service}" || exit 1
            done

            # A valid manifest is not enough: fail the deployment on startup crashes.
            sudo make ready ENV="$ENV" ENV_FILE="$ENV_FILE_PATH" || exit 1
            sudo make check-db ENV="$ENV" ENV_FILE="$ENV_FILE_PATH" || exit 1

            echo "Clean"
            yes | sudo docker system prune -a

            # check services
            sudo docker stack services "$STACK_NAME"
